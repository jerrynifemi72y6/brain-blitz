plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jerrynifemi.brainblitz'
    compileSdk 34

    defaultConfig {
        applicationId "com.jerrynifemi.brainblitz"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "3.1"
    }

    // A fixed key, committed to the repo, so every build can install over the
    // previous one. Without this each CI run signed with a fresh debug key and
    // Android refused the update ("App not installed").
    signingConfigs {
        release {
            storeFile file("../keystore/brainblitz.p12")
            storePassword "brainblitz2026"
            keyAlias "brainblitz"
            keyPassword "brainblitz2026"
            storeType "PKCS12"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
