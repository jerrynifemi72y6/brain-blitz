name: Lite APK (diagnostic)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build silent test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK" -path '*cmdline-tools*/bin/sdkmanager' | sort | tail -1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Gradle 8.7
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Swap the two music loops for silence
        run: cp tools/lite/*.wav app/src/main/res/raw/

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Publish lite release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "lite-${{ github.run_number }}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Lite test build ${{ github.run_number }}" \
            --notes "Same game, silence instead of music (about 1.2 MB). Use this only to test whether the phone can install the app at all." \
            --repo "${{ github.repository }}"
